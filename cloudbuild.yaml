substitutions:
  _REGION: us-central1
  _PROJECT: agentic-dispatch
  _REPO: us-central1-docker.pkg.dev/agentic-dispatch/cloud-run-source-deploy
  _CAP_URL: https://cap-srv-1069189829983.us-central1.run.app
  _GOOGLE_MAPS_KEY: ""

steps:

  # 1. Build frontend and agents images in parallel
  - id: build-frontend
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - frontend/nexera-dispatch/Dockerfile
      - -t
      - $_REPO/frontend:$COMMIT_SHA
      - -t
      - $_REPO/frontend:latest
      - --build-arg
      - NEXT_PUBLIC_CAP_URL=$_CAP_URL
      - --build-arg
      - NEXT_PUBLIC_APP_URL=https://frontend-1069189829983.$_REGION.run.app
      - --build-arg
      - NEXT_PUBLIC_GOOGLE_MAPS_KEY=$_GOOGLE_MAPS_KEY
      - frontend/nexera-dispatch
    waitFor:
      - "-"

  - id: build-agents
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - agents/Dockerfile
      - -t
      - $_REPO/agents:$COMMIT_SHA
      - -t
      - $_REPO/agents:latest
      - agents
    waitFor:
      - "-"

  # 2. Run DB migration in parallel with builds
  - id: migrate-frontend-db
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        apt-get install -y postgresql-client -qq 2>/dev/null
        DB_URL="postgresql://dispatch-user:$$DB_PASS@/dispatch?host=/cloudsql/$_PROJECT:$_REGION:nexera-sbx-db"
        psql "$$DB_URL" -f frontend/nexera-dispatch/scripts/migrate.sql
    secretEnv:
      - DB_PASS
    waitFor:
      - "-"

  # 3. Push images after builds complete
  - id: push-frontend
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - $_REPO/frontend
    waitFor:
      - build-frontend

  - id: push-agents
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - $_REPO/agents
    waitFor:
      - build-agents

  # 4. Deploy frontend (waits for push + migration)
  - id: deploy-frontend
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - frontend
      - --image=$_REPO/frontend:$COMMIT_SHA
      - --region=$_REGION
      - --project=$_PROJECT
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --add-cloudsql-instances=$_PROJECT:$_REGION:nexera-sbx-db
      - --set-env-vars=NODE_ENV=production,NEXT_PUBLIC_CAP_URL=$_CAP_URL,NEXT_PUBLIC_APP_URL=https://frontend-1069189829983.$_REGION.run.app,AGENTS_URL=https://agents-1069189829983.$_REGION.run.app
      - --set-secrets=DATABASE_URL=DATABASE_URL:latest,JWT_SECRET=JWT_SECRET:latest,NEXT_PUBLIC_GOOGLE_MAPS_KEY=GOOGLE_MAPS_API_KEY:latest
    waitFor:
      - push-frontend
      - migrate-frontend-db

  # 5. Deploy agents
  - id: deploy-agents
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - agents
      - --image=$_REPO/agents:$COMMIT_SHA
      - --region=$_REGION
      - --project=$_PROJECT
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --set-env-vars=GOOGLE_PROJECT_ID=$_PROJECT,VERTEX_LOCATION=$_REGION,VERTEX_MODEL=gemini-2.5-flash,CAP_BASE_URL=$_CAP_URL
      - --set-secrets=TEAMS_WEBHOOK_URL=TEAMS_WEBHOOK_URL:latest
    waitFor:
      - push-agents

  # 6. Update cap-srv FRONTEND_BASE_URL after frontend is live
  - id: update-cap-srv
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - services
      - update
      - cap-srv
      - --region=$_REGION
      - --project=$_PROJECT
      - --update-env-vars=FRONTEND_BASE_URL=https://frontend-1069189829983.$_REGION.run.app
    waitFor:
      - deploy-frontend

images:
  - $_REPO/frontend:$COMMIT_SHA
  - $_REPO/frontend:latest
  - $_REPO/agents:$COMMIT_SHA
  - $_REPO/agents:latest

availableSecrets:
  secretManager:
    - versionName: projects/$_PROJECT/secrets/DB_PASSWORD/versions/latest
      env: DB_PASS

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
